# Quick checks on every pull request and push to main: every script parses,
# every JSON file is valid, and the service worker lists only files that
# exist. Catches a broken file before it reaches the site.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scripts parse
        run: |
          for f in *.js tools/*.mjs tools/lib/*.mjs; do node --check "$f"; done
      - name: JSON is valid
        run: |
          git ls-files '*.json' '*.webmanifest' | grep -v '^vendor/' | while read -r f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done
      - name: Service worker shell files exist
        run: node tools/check-shell.mjs
